name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish VisualStudioDebuggerMcp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output artifacts\visual-studio-debugger-mcp-win-x64

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts\visual-studio-debugger-mcp-win-x64\* `
            -DestinationPath artifacts\visual-studio-debugger-mcp-win-x64.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts\visual-studio-debugger-mcp-win-x64.zip#Windows x64" `
            --generate-notes `
            --verify-tag
